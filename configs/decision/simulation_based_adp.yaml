# Event-driven joint worker-task assignment using a learned post-decision value.
# The mfg_flow_shop task taxonomy is inherited only for candidate validation;
# priority_order is not consulted by random rollout or ADP action selection.
defaults:
  - immediate_shared
  - _self_

mode: simulation_based_adp

adp:
  checkpoint_path: ???
  device: auto
  training: false
  force_random_policy: false
  # Explicit WAIT is disabled for fair work-conserving policy comparisons.
  # Set true only for a dedicated WAIT ablation experiment.
  allow_wait_action: false
  # Rotate the first worker expanded by beam search at every joint decision.
  worker_order_strategy: cyclic
  beam_width: 64
  max_review_interval_min: 1.0
  exploration_epsilon: 0.0

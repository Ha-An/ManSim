scenario: mfg_flow_shop
objective_mode: maximize_throughput
horizon_days: 5
worker_counts: [3]
base_seed: 2026

seed_partitions:
  enforce_disjoint: true
  screening_validation: [102626, 102627, 102628, 102629, 102630, 102631, 102632, 102633, 102634, 102635]
  final_selection_validation: [102646, 102647, 102648, 102649, 102650, 102651, 102652, 102653, 102654, 102655]
  held_out_test: [50001, 50002, 50003, 50004, 50005]

diagnostics:
  # Independent greedy calibration plus repeated actions at the selected checkpoint.
  value_validation:
    # Disabled in the 5.79-hour baseline contract. Enable for a separate audit run.
    enabled: false
    checkpoints: [initial, best, last]
    mc_seeds: [942001, 942002, 942003]
    action_checkpoints: [best]
    action_seeds: [943001]
    decision_thresholds: [20, 100]
    candidates_per_state: 3
    future_seeds: [944001, 944002, 944003, 944004, 944005]
    process_count: 10
  ood_support:
    enabled: true
    reference_samples: 1024
    calibration_samples: 1024
    evaluation_samples: 4096
    quantile: 0.95
  fixed_action_probe:
    enabled: false

algorithm:
  return_estimator: monte_carlo
  n_step_enabled: false
  td_bootstrap_enabled: false
  initial_policy: uniform_random_feasible_no_wait
  allow_wait_action: false
  worker_order_strategy: cyclic

# Sparse checkpoint validation is incompatible with per-update conservative gating.
policy_update:
  mode: always_accept
  enabled: false
  acceptance_metric: completed_products_mean
  min_improvement: 0.0
  rollback_model: false
  rollback_optimizer: false

training:
  # One 10-episode initial update, followed by 50 one-wave policy updates.
  initial_random_episodes: 10
  policy_iterations: 50
  episodes_per_iteration: 10
  # Default bounded replay: current wave plus the previous four compact waves.
  replay_scope: recent_window
  replay_window_iterations: 5
  latest_iteration_weight: 2.0
  compact_episode_tensors: true
  # Compact batches are released as soon as they expire from the replay window.
  release_samples_after_update: true
  validation_episode_fraction: 0.10
  epsilon_start: 0.50
  epsilon_end: 0.10
  max_review_interval_min: 1.0
  gamma: 1.0
  batch_size: 512
  learning_rate: 0.00005
  loss_type: mse
  gradient_clip: 0.5
  max_epochs_per_iteration: 3
  early_stopping_patience: 2
  # Experimental same-state action-ranking objective. Keep disabled for the
  # default absolute-MC training contract; enable it only for an ablation.
  pairwise_mc_advantage:
    enabled: false
    loss_weight: 1.0
    capture_episode_fraction: 0.20
    minimum_pairs_per_batch: 2
    decision_thresholds: [20, 100, 300]
    candidates_per_state: 3

validation:
  # Twelve one-wave diagnostics at checkpoints 0, 1, 5, ..., 50.
  combined_checkpoint_evaluation: false
  screening_interval_iterations: 5
  screening_iterations: [0, 1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
  screening_include_initial: true
  screening_seed_count: 10
  final_candidate_count: 1
  # One 10-episode final-selection wave.
  final_selection_seed_count: 10

model:
  embedding_dim: 128
  heads: 4
  layers: 3
  beam_width: 64

rollout:
  parallel: true
  process_count: 10
  wave_size: 10
  device: cpu
  start_method: spawn
  torch_threads_per_process: 1
  deterministic_result_merge: true

runtime:
  device: cuda:0
  require_cuda_training: true
  output_root: outputs/adp_training_worker3_wave_updates
  auto_open_dashboard: false
  retain_episode_events: false
  export_replay_artifacts: false

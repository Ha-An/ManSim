scenario: mfg_flow_shop
objective_mode: maximize_throughput
horizon_days: 5
worker_counts: [3]
base_seed: 2026

seed_partitions:
  enforce_disjoint: true
  # A fixed subset of rollout seeds is re-evaluated greedily to measure policy fit.
  training_evaluation: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
  # Held-out seeds are evaluated with the same frozen checkpoint and epsilon=0.
  screening_validation: [102626, 102627, 102628, 102629, 102630, 102631, 102632, 102633, 102634, 102635]
  final_selection_validation: [102646, 102647, 102648, 102649, 102650, 102651, 102652, 102653, 102654, 102655, 102656, 102657, 102658, 102659, 102660, 102661, 102662, 102663, 102664, 102665, 102666, 102667, 102668, 102669, 102670, 102671, 102672, 102673, 102674, 102675, 102676, 102677, 102678, 102679, 102680, 102681, 102682, 102683, 102684, 102685, 102686, 102687, 102688, 102689, 102690, 102691, 102692, 102693, 102694, 102695, 102696, 102697, 102698, 102699, 102700, 102701, 102702, 102703, 102704, 102705]
  held_out_test: [50001, 50002, 50003, 50004, 50005]

diagnostics:
  # Greedy actions are compared with the previous on-policy batch. Only compact,
  # model-independent afterstate signatures are retained for this diagnostic.
  ood_support:
    enabled: true
    reference_samples: 1024
    calibration_samples: 1024
    evaluation_samples: 4096
    quantile: 0.95
  fixed_action_probe:
    enabled: true
    seeds: [2026001, 2026002]
    decision_thresholds: [20, 100, 300, 600]
    candidates_per_state: 6

algorithm:
  return_estimator: monte_carlo
  n_step_enabled: false
  td_bootstrap_enabled: false
  initial_policy: uniform_random_feasible_with_wait
  allow_wait_action: true

training:
  # One initial wave, then ten policy updates with five rollout waves each.
  initial_random_episodes: 20
  policy_iterations: 10
  episodes_per_iteration: 100
  replay_scope: current_iteration
  compact_episode_tensors: true
  release_samples_after_update: true
  validation_episode_fraction: 0.10
  epsilon_start: 0.20
  epsilon_end: 0.10
  max_review_interval_min: 1.0
  gamma: 1.0
  batch_size: 512
  learning_rate: 0.00005
  loss_type: mse
  gradient_clip: 0.5
  max_epochs_per_iteration: 3
  early_stopping_patience: 2

validation:
  # Every checkpoint (0..10) gets one combined 20-episode diagnostic wave:
  # 10 train-eval seeds + 10 held-out validation seeds, all with epsilon=0.
  combined_checkpoint_evaluation: true
  screening_interval_iterations: 1
  screening_include_initial: true
  train_eval_seed_count: 10
  screening_seed_count: 10
  final_candidate_count: 1
  # Three 20-episode waves for the selected checkpoint.
  final_selection_seed_count: 60

model:
  embedding_dim: 128
  heads: 4
  layers: 3
  beam_width: 64

rollout:
  parallel: true
  process_count: 20
  wave_size: 20
  device: cpu
  start_method: spawn
  torch_threads_per_process: 1
  deterministic_result_merge: true

runtime:
  device: cuda:0
  require_cuda_training: true
  output_root: outputs/adp_training
  auto_open_dashboard: false
  retain_episode_events: false

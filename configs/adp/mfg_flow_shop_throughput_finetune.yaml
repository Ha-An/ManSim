scenario: mfg_flow_shop
objective_mode: maximize_throughput
horizon_days: 5
worker_counts: [3]
base_seed: 602026

warm_start:
  enabled: true
  checkpoint_path: outputs/adp_training_worker3_n_step_td/20260918_163053/best.pt
  replay_fill_epsilon: 0.10

seed_partitions:
  enforce_disjoint: true
  screening_validation: [702626, 702627, 702628, 702629, 702630, 702631, 702632, 702633, 702634, 702635]
  final_selection_validation: [702646, 702647, 702648, 702649, 702650, 702651, 702652, 702653, 702654, 702655]
  held_out_test: [50001, 50002, 50003, 50004, 50005]

diagnostics:
  value_validation:
    enabled: false
  ood_support:
    enabled: true
    reference_samples: 1024
    calibration_samples: 1024
    evaluation_samples: 4096
    quantile: 0.95
  fixed_action_probe:
    enabled: false

algorithm:
  return_estimator: n_step_td
  n_step_enabled: true
  n_step: 30
  td_bootstrap_enabled: true
  off_policy_correction: truncate_on_greedy_mismatch
  initial_policy: uniform_random_feasible_no_wait
  allow_wait_action: false
  worker_order_strategy: cyclic

policy_update:
  mode: always_accept
  enabled: false
  acceptance_metric: completed_products_mean
  min_improvement: 0.0
  rollback_model: false
  rollback_optimizer: false

training:
  # Iteration 0 fills replay with the source policy and does not update it.
  initial_random_episodes: 50
  initial_update_epochs: 0
  policy_iterations: 20
  episodes_per_iteration: 10
  replay_scope: recent_episodes
  replay_capacity_episodes: 100
  # Every fine-tuning update uses the current 10 episodes plus 20 historical episodes.
  replay_sample_episodes_per_update: 30
  target_tau: 0.03
  compact_episode_tensors: true
  release_samples_after_update: true
  validation_episode_fraction: 0.10
  epsilon_start: 0.15
  epsilon_end: 0.05
  max_review_interval_min: 1.0
  gamma: 1.0
  batch_size: 512
  learning_rate: 0.00002
  loss_type: mse
  gradient_clip: 0.5
  max_epochs_per_iteration: 2
  pairwise_mc_advantage:
    enabled: false
    loss_weight: 1.0
    capture_episode_fraction: 0.20
    minimum_pairs_per_batch: 2
    decision_thresholds: [20, 100, 300]
    candidates_per_state: 3

validation:
  combined_checkpoint_evaluation: false
  screening_interval_iterations: 5
  screening_iterations: [0, 5, 10, 15, 20]
  screening_include_initial: true
  screening_seed_count: 10
  final_candidate_count: 1
  final_selection_seed_count: 10

model:
  embedding_dim: 128
  heads: 4
  layers: 3
  beam_width: 64

rollout:
  parallel: true
  process_count: 10
  wave_size: 10
  device: cpu
  start_method: spawn
  torch_threads_per_process: 1
  deterministic_result_merge: true

runtime:
  device: cuda:0
  require_cuda_training: true
  output_root: outputs/adp_training_worker3_n_step_td_finetune
  auto_open_dashboard: true
  retain_episode_events: false
  export_replay_artifacts: false

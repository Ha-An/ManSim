# Legacy 3-6 worker profile retained for later fleet-generalization studies.
scenario: mfg_flow_shop
objective_mode: maximize_throughput
horizon_days: 5
worker_counts: [3, 4, 5, 6]
base_seed: 2026

algorithm:
  return_estimator: monte_carlo
  n_step_enabled: false
  td_bootstrap_enabled: false
  initial_policy: uniform_random_feasible_no_wait
  allow_wait_action: false

training:
  initial_random_episodes: 100
  policy_iterations: 25
  episodes_per_iteration: 20
  replay_scope: current_iteration
  compact_episode_tensors: true
  release_samples_after_update: true
  validation_interval_iterations: 5
  validation_seeds_per_worker: 5
  validation_episode_fraction: 0.20
  epsilon_start: 0.20
  epsilon_end: 0.02
  max_review_interval_min: 5.0
  gamma: 1.0
  batch_size: 256
  learning_rate: 0.001
  loss_type: mse
  gradient_clip: 1.0
  max_epochs_per_iteration: 10
  early_stopping_patience: 3

model:
  embedding_dim: 128
  heads: 4
  layers: 3
  beam_width: 64

rollout:
  parallel: true
  process_count: 10
  wave_size: 10
  device: cpu
  start_method: spawn
  torch_threads_per_process: 1
  deterministic_result_merge: true

runtime:
  device: cuda:0
  require_cuda_training: true
  output_root: outputs/adp_training
  auto_open_dashboard: true
  retain_episode_events: false
